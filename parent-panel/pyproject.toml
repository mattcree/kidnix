[project]
name = "kidnix-parent-panel"
version = "0.1.0"
description = "kidnix parent panel -- the grown-up's libadwaita app on the parent's GNOME session"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# Same rule as shell/pyproject.toml: PyGObject, GTK4 and libadwaita come from
# the system (python3-gobject / gtk4 / libadwaita RPMs), never from PyPI.
# `kidnix_shell` is imported READ-ONLY, for validation, and is optional at
# import time so the pure model and its tests run on a machine without it.
dependencies = []

[project.scripts]
kidnix-parent-panel = "kidnix_parent_panel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "kidnix-shell",
]

[tool.uv.sources]
kidnix-shell = { path = "../shell" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kidnix_parent_panel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["kidnix_parent_panel", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # line length is the formatter's job
    "B008",  # GTK constructors in defaults are fine where used
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["kidnix_parent_panel", "kidnix_shell"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# GdkPixbuf is the only way to rasterise an SVG at a chosen size without an
# icon-theme directory tree; both routes off it are marked deprecated in GTK
# 4.22 and neither has a replacement that takes a size.
filterwarnings = ["ignore::DeprecationWarning"]
