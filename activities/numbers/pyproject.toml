[project]
name = "kidnix-numbers"
version = "0.1.0"
description = "Numbers -- the kidnix subitising and number-bonds activity: how many, and which two numbers make five"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# Deliberately no runtime dependencies. The arrangements, the item generation,
# the words and the settings are pure Python; the drawing is `cairo` and the
# window is `kidnix_activity`, and both of those come from the image -- the
# same wheel and the same `cp -a` as the shell (build_files/60-shell.sh) --
# never PyPI. See docs/design/activity-sdk.md section 10, which is also why the
# venv is created with `--system-site-packages` and why this list is empty.
dependencies = []

[project.scripts]
kidnix-numbers = "numbers_activity.activity:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["numbers_activity"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["numbers_activity", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import order
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF",
]
ignore = [
    "E501",  # line length is the formatter's job
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["numbers_activity"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
