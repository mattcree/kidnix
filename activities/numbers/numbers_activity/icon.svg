<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="five dots in the pattern on a dice, on a card">
<title>Numbers</title>
<!-- Five, in the arrangement a child has already seen a hundred times on a
     dice and on their fingers. Canonical arrangements are the whole point of
     the activity (05 section 2c: subitise to five), so the tile is one — and
     it is plain counters on plain paper rather than five cupcakes, because
     perceptual richness is a measured harm here (Kaminski & Sloutsky 2013).
     The pale bar under the dots is the top row of a ten-frame: what five looks
     like when it is on its way to ten. -->
<g stroke="#16181d" stroke-width="5" stroke-linejoin="round">
  <rect x="10" y="14" width="100" height="92" rx="18" fill="#fbf7ef"/>
</g>
<g fill="#0f8a8a">
  <circle cx="36" cy="40" r="11"/>
  <circle cx="84" cy="40" r="11"/>
  <circle cx="60" cy="62" r="11"/>
  <circle cx="36" cy="84" r="11"/>
  <circle cx="84" cy="84" r="11"/>
</g>
</svg>
