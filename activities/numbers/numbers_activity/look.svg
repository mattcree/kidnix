<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="an eye, for looking again">
<title>Again</title>
<!-- "Show me the dots again." An eye, because the thing the button does is let
     a child *look* -- and because SDK section 12 says no control is text-only:
     a pre-reader who cannot read "Again" can still see what this one is for.
     Deliberately not an arrow (that means "next" everywhere else in kidnix) and
     not a clock. -->
<path d="M4 32c9-13 19-19 28-19s19 6 28 19c-9 13-19 19-28 19S13 45 4 32Z"
      fill="#fbf7ef" stroke="#16181d" stroke-width="4" stroke-linejoin="round"/>
<circle cx="32" cy="32" r="10" fill="#0f8a8a" stroke="#16181d" stroke-width="4"/>
</svg>
