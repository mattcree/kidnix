# Sounds & Words -- the kidnix literacy activity.
#
# The shell reads this at start-up (spec section 4) and
# `kidnix-activity validate manifest.toml` checks it; `tests/test_manifest.py`
# runs the same validator, so a manifest that would be rejected on the machine
# is rejected in CI first.
#
# NOT yet installed on the image. A later image wave copies the package beside
# the shell and this file into /usr/share/kidnix/activities/ -- see
# docs/design/sounds-and-words.md section 12 for that plan and what it has to
# assert. Until then the tile does not exist, which is correct: a tile that
# opens a half-built activity is worse than no tile.
schema = 1

id = "sounds-and-words"
name = "Sounds & words"

# What the shell says when a child hovers or focuses the tile. Written for the
# ear, and it says what *happens*, not what it is for -- the goal line below is
# for the grown-up.
audio_label = "Sounds and words. Find the sound, then push the sounds together to make a word."

# One honest line for a parent, and it is the sentence the whole activity is
# held to (research 10 section 4.6 #8, and docs/design/sounds-and-words.md 0).
# It does not claim to teach reading, because no product in this space has that
# evidence and two of the best-funded attempts produced -1 month and +0.08.
goal = "Practises the letter sounds the school has already taught. Not a reading programme."

icon = "kidnix-learn"
icon_kind = "icon-name"

category = "learn"
# Overlap, not containment: a 4-5 profile and a 6-8 profile both see this.
# Reception and Year 1 are where a UK phonics progression actually lives.
age_band = "4-6"

exec = ["/usr/bin/kidnix-sounds-and-words"]

# The SDK saves on SIGTERM and never shows a quit dialogue
# (kidnix_activity.lifecycle; docs/design/activity-sdk.md 3.3). Five seconds is
# spec 7a's autosave grace, and what it covers here is one JSON file and one
# small PNG.
quit = "signal"
quit_grace = 5.0

# The child session has no egress (SYNTHESIS H1), and this activity has no use
# for it: the corpus is on disk and there is no account, no sync and no model.
network_required = false

# No journal_watch and no journal_glob, deliberately. The activity writes its
# own entry with kidnix_activity.journal.save_entry, so there is nothing for the
# shell's importer to notice two seconds later -- and an importer watching a
# scratch directory would keep the same card twice
# (docs/design/activity-sdk.md 8).

notes = "Corpus: Letters and Sounds (2007), OGL v3.0, Crown copyright. See activities/sounds_and_words/LICENSES.md."
