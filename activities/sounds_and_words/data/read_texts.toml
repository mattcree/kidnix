# Twelve decodable texts, written for kidnix. Hand-written; not generated.
#
# Provenance: **ours**, Apache-2.0, like the rest of kidnix. They are not
# Letters and Sounds material and carry no OGL notice -- what came from L&S is
# the *word bank* they are composed of (`data/words.toml`, `data/lexicon.toml`,
# `data/tricky_words.toml`), and a sentence built out of licensed words is no
# more a derivative of that licence than a sentence built out of a dictionary
# is a derivative of the dictionary. `LICENSES.md` section 4 is the ledger row.
#
# The rule every one of them is held to, and the reason this file may be edited
# by hand while `data/graphemes.toml` beside it may not: **every word is
# checked against the ceiling in strict mode** (`tests/test_reading.py`).
# Strict means a word with no segmentation on record is refused rather than
# guessed at, so nothing can be written here that the corpus cannot prove
# decodable. If a word you want is missing, it is missing from the L&S banks,
# and the answer is a different word -- never a looser check.
#
# `after_order` is the *lowest* teaching order at which the whole text, title
# included, becomes readable. It is declared rather than computed so that a
# careless edit shows up as a failing test instead of as a text that quietly
# moved up a set: `test_reading.py` asserts each text passes at exactly that
# order and fails at the one below it.
#
# The spread is one text per Phase 2 set at sets 2 and 3, two at set 4, two at
# set 5, and five across Phase 3 at orders 24, 29, 34, 39 and 50 -- Phase 3 is
# by far the longest stretch of the progression (twenty-seven GPCs against
# Phase 2's twenty-three) and a single text for the whole of it would leave a
# child re-reading the same book for a term.
#
# `pictures` is one drawing per line and `cover` is the one on the shelf. They
# name files in `sounds_and_words/scenes/` or `sounds_and_words/pictures/`, and
# they are **congruent**: the drawing shows what the sentence says (Takacs,
# Swart & Bus 2015 -- congruent multimedia helps, and the incongruent kind is
# where the harm in that meta-analysis lives). Repetition across lines is
# deliberate; a fresh picture per line that had nothing to do with the line
# would be worse than the same pond twice.
#
# Everything is lowercase, including the names, because everything child-facing
# in this activity is lowercase (design note section 2.2) and because the L&S
# caption bank these words come from is set that way too.

schema = 1

