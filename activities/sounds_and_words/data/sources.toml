[corpus]
name = "kidnix Sounds & Words corpus"
version = 1
generated_from = "Letters and Sounds (2007) and the DfE Reading Framework (2023)"
lowercase = true
note = """
Everything a child is shown is lowercase. Word banks, graphemes and tricky
words are stored lowercase. Captions, sentences and book text are stored twice:
`text` exactly as printed in the source (so the transcription can be checked
against the PDF) and `text_lower` for display.
"""

