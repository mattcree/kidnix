# --------------------------------------------------------------------------
# The Reading Framework acceptance test
# --------------------------------------------------------------------------

[acceptance_test]
name = "Reading Framework Appendix 7"
source = "reading_framework_2023"
pages = "pp.144-145"
stated_gpcs = """
'A Reception child learning through a typical systematic synthetic phonics (SSP)
programme might know: the phonemes corresponding to each letter of the alphabet;
the phonemes corresponding to "ck", "sh", "th", "ng", "ee", "oo", "or", "ar";
exception words: "to", "the", "we".'
"""
framework_footnote = "'The GPCs are not quoted from a published programme; they are examples only.'"
expected = "Books 1 and 2 rejected; Books 3 and 4 accepted."
kidnix_additions_to_the_stated_set = """
The framework's list names no doubled-consonant graphemes, but Book 3 contains
'off' and 'will' and Book 4 contains 'dropping' and 'getting'. The fixture
ceiling therefore adds ff, ll, ss, zz and the kidnix doublets (bb dd gg mm nn
pp rr tt), and the two L&S footnote variants s->/z/ and f->/v/. Recorded here
rather than buried in the fixture, because an acceptance test that quietly
widens its own ceiling is not an acceptance test.
"""

# --------------------------------------------------------------------------
# What kidnix added, and why
# --------------------------------------------------------------------------

[[addition]]
kind = "gpc"
ids = ["bb", "dd", "gg", "mm", "nn", "pp", "rr", "tt"]
added_by = "kidnix"
order = 16
reason = """
L&S teaches ff, ll and ss explicitly at Phase Two set 5, and says (p.70) that a
doubled letter 'represents one phoneme'. It never introduces the other doubled
consonants as GPCs, but uses them freely in its own word banks from set 4 on:
rocket, carrot, ticket, pocket, rabbit, sitting, letter, ladder, supper. Without
them those words segment into the wrong number of phonemes, which would put the
wrong number of sound buttons under them. Introduced at order 16, where they
first appear in the banks.
"""

[[addition]]
kind = "gpc"
ids = ["or_er"]
added_by = "kidnix"
order = 103
reason = """
'or' standing for /ur/, as in word, worm, work. Not in L&S's alternative-
pronunciation table. Added because the Reading Framework's Appendix 7 turns on
exactly this distinction: a child taught 'or' as /or/ can read 'worn' (Book 4)
but not 'worms' (Book 1). Both segment into the same taught graphemes; only the
pronunciation separates them. Without this GPC the acceptance test cannot tell
the two books apart, and neither could the filter.
"""

[[addition]]
kind = "untaught_pseudo_gpcs"
count = 15
added_by = "kidnix"
reason = """
Pseudo-GPCs (e_silent, le, ed_t, ei, ere_er, ough, augh, ...) that are never in
any ceiling at any phase. They exist so the corpus can say precisely *why* a
word is not decodable rather than merely that it is not. They are what makes
'puddle', 'jumped', 'their' and 'were' reject with an explanation.
"""

# --------------------------------------------------------------------------
# What was left out of the L&S banks, and why
# --------------------------------------------------------------------------

[[omitted]]
word = "ass"
source = "ls2007:p.70"
reason = "in the (+ss) column; not a word a five-year-old's machine should offer unprompted"

[[omitted]]
word = "god"
source = "ls2007:p.69"
reason = "in the (+o) column; a religious proper noun has no place in a phonics word bank"

[[omitted]]
word = "queue"
source = "ls2007:p.151"
reason = "listed under 'ue' but not analysable as a decodable string at all"

[[omitted]]
word = "whistle"
source = "ls2007:p.151"
reason = "listed under 'wh' but needs the final 'le' syllable, which L&S never teaches as a GPC"

[[omitted]]
word = "scene"
source = "ls2007:p.152"
reason = "listed under 'e-e' but its 'c' stands for no phoneme at all, so it could never pass any ceiling and would sit in the bank unusable"

# --------------------------------------------------------------------------
# Places where L&S's own material does not pass its own gate
# --------------------------------------------------------------------------

[[audit]]
finding = "L&S captions and sentences that are not fully decodable at the phase they are printed in"
detail = """
Transcribing the banks and then running them back through the filter turns up a
short list. 'into' appears in a Phase Three sentence (p.101, p.103) but its
final 'o' stands for /oo/, a Phase Five alternative pronunciation. 'may' appears
in an end-of-Phase-Three text (p.103) but 'ay' is a Phase Five grapheme. 'by'
appears in a Phase Four question (p.128) but 'y' as /igh/ is Phase Five. 'Ken'
is printed in the set 3 (+k) column though the 'e' it needs is a set 4 letter.
These are not transcription errors; they are in the document. kidnix's filter
rejects those sentences at those phases, which is the correct behaviour and the
whole point of having a filter. The list is asserted in
tests/test_letters_and_sounds_audit.py so that it cannot drift silently.
"""

[[audit]]
finding = "L&S's northern/southern vowel notes"
detail = """
p.126 marks ask, fast, last, daft, task, glass, grass, brass as Phase Four
words 'in the North of England, where the letter a is pronounced /a/', and
p.153 says the alternative pronunciations of 'a' and 'u' apply in the South
only. kidnix takes the short-a reading for those words, which is what makes
them decodable at Phase Four at all, and records the choice here rather than
pretending the question does not exist. A future release could make it a
parent setting; the evidence that it matters at five is [absent].
"""
