[project]
name = "kidnix-clock-time"
version = "0.1.0"
description = "Clock -- the kidnix clock-and-time activity: play with the hands, and see how long a minute is"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# Deliberately no runtime dependencies. The words, the snapping, the routine
# and the verdict bands are pure Python; the drawing is `cairo` and the window
# is `kidnix_activity`, and both of those come from the image -- the same wheel
# and the same `cp -a` as the shell (build_files/60-shell.sh) -- never PyPI.
# See docs/design/activity-sdk.md section 10, which is also why the venv is
# created with `--system-site-packages` and why this list is still empty.
dependencies = []

[project.scripts]
kidnix-clock-time = "clock_time.activity:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clock_time"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["clock_time", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import order
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF",
]
ignore = [
    "E501",  # line length is the formatter's job
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["clock_time"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
