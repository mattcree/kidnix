---
name: boot-test

# Experimental but not advisory: if this job runs, it must pass. It skips
# cleanly (green, with a clear message) when the runner has no KVM, because a
# TCG boot of a full GNOME stack will not finish inside any sane timeout.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Image to boot (default: build it from this checkout)"
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: boot-test-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: kidnix

jobs:
  boot-test:
    name: boot a real VM
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check for KVM
        id: kvm
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::KVM is available; running the full boot test."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::/dev/kvm is not available on this runner. \
            Skipping the boot test -- software emulation cannot boot a GNOME \
            image within the timeout. Run 'just test-boot' locally instead."
          fi

      - name: Free disk space
        if: steps.kvm.outputs.available == 'true'
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" \
                      /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h / | tail -1

      - uses: actions/checkout@v4
        if: steps.kvm.outputs.available == 'true'

      - name: Install just, qemu and OVMF
        if: steps.kvm.outputs.available == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf imagemagick
          sudo install -d -m 0755 /usr/share/OVMF
          # Debian ships OVMF_CODE_4M.fd; the test also probes this path.
          [[ -e /usr/share/OVMF/OVMF_CODE.fd ]] || \
            sudo ln -sf /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd

      - name: Install just
        if: steps.kvm.outputs.available == 'true'
        uses: extractions/setup-just@v2

      - name: Grant access to /dev/kvm
        if: steps.kvm.outputs.available == 'true'
        run: |
          set -euo pipefail
          sudo usermod -aG kvm "$USER" || true
          sudo chmod 0666 /dev/kvm

      - name: Build image
        if: steps.kvm.outputs.available == 'true' && inputs.image_ref == ''
        run: just build

      - name: Pull image
        if: steps.kvm.outputs.available == 'true' && inputs.image_ref != ''
        run: |
          set -euo pipefail
          podman pull "${{ inputs.image_ref }}"
          podman tag "${{ inputs.image_ref }}" "localhost/${IMAGE_NAME}:latest"

      - name: Generate an ephemeral SSH key for the VM
        if: steps.kvm.outputs.available == 'true'
        run: ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 <<< y

      # Runners have passwordless sudo, so the one interactive step in the
      # local workflow is fully automatic here.
      - name: Build qcow2
        if: steps.kvm.outputs.available == 'true'
        run: just build-qcow2

      - name: Boot test
        if: steps.kvm.outputs.available == 'true'
        run: just test-boot --verbose

      - name: Upload boot artifacts
        # Upload on failure too -- the screenshot and serial log are the whole
        # point of this job when something breaks.
        if: always() && steps.kvm.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-artifacts
          path: |
            output/boot.png
            output/boot.ppm
            output/boot-serial.log
          if-no-files-found: warn
          retention-days: 14
