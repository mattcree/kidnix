---
name: boot-test

# Experimental but not advisory: if this job runs, it must pass. It skips
# cleanly (green, with a clear message) when the runner has no KVM, because a
# TCG boot of a full GNOME stack will not finish inside any sane timeout.
#
# The boot test runs under bcvk ("bootc virtualization kit"), which boots the
# *container image* as a VM directly -- no disk image, no privileged podman,
# no sudo. A cold run is well under a minute locally; on a GitHub runner the
# same boot is nested virtualisation on shared Azure hardware and takes several
# times longer, which is why the ssh budget here is generous. See tests/README.md.
on:
  push:
    # 'ci/**' so a CI change can be proven on its own branch before it lands.
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Image to boot (default: build it from this checkout)"
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: boot-test-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: kidnix
  # Keep in step with `bcvk_version` in the Justfile.
  BCVK_VERSION: "0.18.0"
  # Ceiling, not a target: a healthy nested boot on a runner is ~2-4 minutes.
  # Anything approaching this is a real failure and the artifacts will say so.
  BOOT_TIMEOUT_SECONDS: "600"
  # A hosted runner has 2 cores. Handing the guest more vCPUs than the host has
  # only buys contention between QEMU, virtiofsd and the harness.
  BOOT_VCPUS: "2"

jobs:
  # Cheap on every event: byte-compile both harnesses and check their
  # plumbing. Costs seconds and catches a typo before we spend 20 minutes
  # building an OS image.
  harness:
    name: boot harness self-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install bcvk
        run: just bcvk-install

      - name: Validate both boot harnesses
        run: |
          set -euo pipefail
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python3 -m py_compile tests/boot/bcvk_boot_test.py tests/boot/boot_test.py
          # --dry-run tolerates a missing image; it must not tolerate a broken
          # script, so a non-zero exit here is a real failure.
          PATH="$HOME/.local/bin:$PATH" python3 tests/boot/bcvk_boot_test.py \
            --dry-run --image "localhost/${IMAGE_NAME}:latest"

  boot-test:
    name: boot a real VM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check for KVM
        id: kvm
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::KVM is available; running the full boot test."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::/dev/kvm is not available on this runner. \
            Skipping the boot test -- software emulation cannot boot a GNOME \
            image within the timeout. Run 'just test-boot' locally instead."
          fi

      - name: Free disk space
        if: steps.kvm.outputs.available == 'true'
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" \
                      /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h / | tail -1

      - uses: actions/checkout@v7
        if: steps.kvm.outputs.available == 'true'

      - name: Install just
        if: steps.kvm.outputs.available == 'true'
        uses: extractions/setup-just@v4

      - name: Install podman, qemu and virtiofsd
        if: steps.kvm.outputs.available == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          # bcvk runs QEMU inside a podman container but takes both QEMU and
          # virtiofsd from the *host* /usr, which it bind-mounts in. So these
          # are host packages, not image packages, and both are mandatory.
          sudo apt-get install -y --no-install-recommends \
            podman qemu-system-x86 qemu-utils virtiofsd

      # THE fix. noble ships virtiofsd 1.10.0, which does not know
      # `--allow-mmap`; bcvk 0.18 passes it unconditionally, so virtiofsd exits
      # 2 with a clap usage error, bcvk's entrypoint aborts, and the VM
      # container is gone before QEMU ever runs -- which is why there was no
      # console log, no journal and nothing to look at. 1.14.0 is the version
      # Fedora/Bluefin ships, so this makes CI match the developer's machine
      # rather than papering over a difference. Its dependencies (libc6 >=
      # 2.39, libcap-ng0, libseccomp2, libgcc-s1) are all satisfied on noble.
      - name: Install virtiofsd 1.14 (noble's 1.10 is too old for bcvk)
        if: steps.kvm.outputs.available == 'true'
        run: |
          set -euo pipefail
          deb=virtiofsd_1.14.0-3_amd64.deb
          curl -fsSL --retry 3 -o "/tmp/${deb}" \
            "http://archive.ubuntu.com/ubuntu/pool/universe/r/rust-virtiofsd/${deb}"
          echo "1bd9cff8d6d6d6a5a0e615a985805431ce4760f35cc35969165492421f92cdb9  /tmp/${deb}" \
            | sha256sum -c -
          sudo dpkg -i "/tmp/${deb}"
          /usr/libexec/virtiofsd --version
          # Prove it takes the flags bcvk will hand it, before we spend a build
          # on finding out. Exit 2 here is the exact bug this step exists for.
          /usr/libexec/virtiofsd --print-capabilities >/dev/null
          /usr/libexec/virtiofsd --help | grep -q -- --allow-mmap

      - name: Install bcvk
        if: steps.kvm.outputs.available == 'true'
        run: |
          set -euo pipefail
          just bcvk-install "${BCVK_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bcvk" --version

      # Everything bcvk needs from the host, made explicit and printed. When
      # this job breaks again, the first question is "did the runner change?"
      # and this step is the answer.
      - name: Prepare and report the virtualisation host
        if: steps.kvm.outputs.available == 'true'
        run: |
          set -euo pipefail
          # 0666 rather than group membership: `usermod -aG kvm` does not apply
          # to the already-running shell, and bcvk passes the host's /dev/kvm
          # straight into the (rootless, unprivileged) VM container.
          sudo chmod 0666 /dev/kvm
          # bcvk gives the guest a vsock so it can stream its journal out while
          # it boots -- the only diagnostic available when sshd never answers.
          # The module is not loaded on a stock runner.
          sudo modprobe vhost_vsock || echo "::warning::no vhost_vsock; the guest journal stream will be missing"
          # 0660 root:kvm otherwise, and `runner` is not in the kvm group.
          sudo chmod 0666 /dev/vhost-vsock || true
          # Ubuntu 24.04 forbids unprivileged user namespaces to unconfined
          # processes (AppArmor). bcvk's container entrypoint unshares one --
          # it runs virtiofsd and QEMU under bwrap -- so without this the
          # container exits before QEMU starts: no console.txt, no journal,
          # nothing but an empty output directory. Fedora has no such
          # restriction, which is why this only ever bites in CI.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          ls -l /dev/kvm /dev/vhost-vsock /dev/vhost-net 2>&1 || true
          # Nothing below may fail the step: this is a report, not a gate.
          {
            echo "--- qemu ---";      qemu-system-x86_64 --version
            echo "--- virtiofsd ---"; ls -l /usr/libexec/virtiofsd /usr/lib/virtiofsd
            echo "--- podman ---";    podman version
            echo "--- cpu ---";       nproc
            grep -Eo 'vmx|svm|hypervisor' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
            echo "--- session ---";   id; echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-unset}"
            echo "--- userns ---"
            sysctl kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces
            free -m
          } 2>&1 || true

      - name: Build image
        if: steps.kvm.outputs.available == 'true' && inputs.image_ref == ''
        run: just build

      # The fast iteration path: `workflow_dispatch` with an image_ref skips the
      # ~10 minute build and boots something already in the registry.
      - name: Log in to ghcr.io
        if: steps.kvm.outputs.available == 'true' && inputs.image_ref != ''
        uses: redhat-actions/podman-login@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        if: steps.kvm.outputs.available == 'true' && inputs.image_ref != ''
        run: |
          set -euo pipefail
          podman pull "${{ inputs.image_ref }}"
          podman tag "${{ inputs.image_ref }}" "localhost/${IMAGE_NAME}:latest"

      # The whole test: rootless, no disk image. Nothing here needs sudo.
      - name: Boot test
        if: steps.kvm.outputs.available == 'true'
        run: |
          just test-boot \
            --timeout "${BOOT_TIMEOUT_SECONDS}" \
            --cpus "${BOOT_VCPUS}" \
            --verbose

      # The harness already writes output/diagnostics.txt and prints the tail of
      # the console and the guest journal before the VM is torn down. This adds
      # the things only the runner knows, and only when we need them.
      - name: Host diagnostics
        if: failure() && steps.kvm.outputs.available == 'true'
        run: |
          set -uo pipefail
          mkdir -p output
          {
            echo "===== podman ps -a ====="; podman ps -a
            echo "===== bcvk ephemeral ps ====="; bcvk ephemeral ps
            echo "===== dmesg (tail) ====="; sudo dmesg | tail -60
            echo "===== kvm ====="; ls -l /dev/kvm /dev/vhost-vsock 2>&1
            lsmod | grep -E 'kvm|vhost' || echo "(no kvm/vhost modules listed)"
            echo "===== output/ ====="; ls -la output
            echo "===== df ====="; df -h /
          } > output/runner-diagnostics.txt 2>&1
          cat output/runner-diagnostics.txt
          for f in output/console.txt output/boot-journal-stream.txt; do
            if [[ -s "$f" ]]; then
              echo "::group::last 100 lines of $f"; tail -100 "$f"; echo "::endgroup::"
            else
              echo "::warning::$f is missing or empty"
            fi
          done

      - name: Upload boot artifacts
        # Everything, always. The console log, the streamed guest journal and
        # the host-side diagnostics are the entire value of this job when it
        # breaks, and naming individual files is how we ended up with a failing
        # run and no artifact at all.
        #
        # continue-on-error because the upload is a convenience, not the test:
        # this account has run out of Actions artifact storage before, and a
        # storage quota must never be able to fail a boot that passed. The job
        # log carries the same diagnostics either way.
        if: always() && steps.kvm.outputs.available == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: boot-test-artifacts
          # journal*.json is the raw stream; boot-journal-stream.txt is the
          # same content in a form a human reads, at a fraction of the size.
          path: |
            output/
            !output/journal*.json
            !output/qcow2
          if-no-files-found: warn
          retention-days: 7

      - name: Clean up any VM left behind
        if: always() && steps.kvm.outputs.available == 'true'
        run: just vm-clean || true
