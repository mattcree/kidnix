---
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild so the image picks up Fedora security updates even when
    # nobody has touched the repo. Mondays, 06:17 UTC (off the hour on purpose:
    # GitHub's scheduler is heavily contended at :00).
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  IMAGE_NAME: kidnix
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  BASE_IMAGE: ghcr.io/ublue-os/base-main
  BASE_TAG: "44"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: just --fmt --check
        run: just --unstable --fmt --check

      - name: shellcheck
        run: just lint-shell

      - name: hadolint
        run: just lint-containerfile

      - name: yamllint
        run: just lint-yaml

      - name: ruff
        run: just lint-python

      - name: boot test is syntactically valid
        run: python3 -m py_compile tests/boot/boot_test.py

  build:
    name: build image
    runs-on: ubuntu-24.04
    needs: lint
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      # The base image is ~6 GB uncompressed; a stock runner has ~14 GB free
      # and will fill up mid-build without this.
      - name: Free disk space
        run: |
          set -euo pipefail
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" \
                      /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune --all --force || true
          echo "after:"; df -h / | tail -1

      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          date_tag="$(date -u +%Y%m%d)"
          sha_tag="${GITHUB_SHA::7}"
          {
            echo "date_tag=${date_tag}"
            echo "sha_tag=${sha_tag}"
            echo "tags=latest ${date_tag} ${sha_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        id: build
        run: |
          set -euo pipefail
          podman build \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            --build-arg BASE_TAG="${BASE_TAG}" \
            --build-arg KIDNIX_VERSION="${{ steps.meta.outputs.date_tag }}" \
            --build-arg KIDNIX_PRETTY_VERSION="${{ steps.meta.outputs.date_tag }}.${{ steps.meta.outputs.sha_tag }}" \
            --tag "localhost/${IMAGE_NAME}:latest" \
            -f Containerfile .
          # push-to-registry looks every tag up in local storage by name.
          podman tag "localhost/${IMAGE_NAME}:latest" \
            "localhost/${IMAGE_NAME}:${{ steps.meta.outputs.date_tag }}" \
            "localhost/${IMAGE_NAME}:${{ steps.meta.outputs.sha_tag }}"
          podman image inspect "localhost/${IMAGE_NAME}:latest" \
            --format '{{ .Size }}' | numfmt --to=iec | sed 's/^/image size: /'

      - name: Test image
        run: just test-image

      # Three gates the audit (docs/design/cci-compliance-audit-2026-08-22.md
      # §3.2) found missing: nothing in CI checked egress, licences or what was
      # actually in the image. `just test-image` above now covers egress
      # statically; these two cover the other pair.
      #
      # `bootc container lint` already runs inside the Containerfile, so a bad
      # bootc layout has failed the build before we get here.
      - name: Licence gate
        run: just licenses

      - name: Package lock and denylist
        run: just packages-check

      # Kept whether the step above passed or failed: when it fails, the list is
      # what you diff against tests/image/packages.lock to see what moved.
      - name: Upload the package list
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: output/packages.txt
          if-no-files-found: warn
          retention-days: 14

      # Only main publishes. PRs build and test but never push, so a fork PR
      # can never write to the registry.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: redhat-actions/podman-login@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to ghcr.io
        id: push
        if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: latest ${{ steps.meta.outputs.date_tag }} ${{ steps.meta.outputs.sha_tag }}
          registry: ${{ env.IMAGE_REGISTRY }}

      # Keyless signing: the OIDC token from id-token:write is the identity, so
      # there is no key to manage or leak. Verify a pulled image with:
      #   cosign verify ghcr.io/<owner>/kidnix:latest \
      #     --certificate-identity-regexp='^https://github.com/<owner>/kidnix/' \
      #     --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # Key-based signature: the image's own /etc/containers/policy.json
      # verifies THIS key (system_files/etc/pki/containers/kidnix.pub) before
      # `bootc upgrade` replaces the OS. Keyless can't be expressed in
      # policy.json for a GHA identity (see build_files/75-supply-chain.sh),
      # so this is the signature the device actually checks.
      - name: Sign image (device-verified key)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          cosign verify --key system_files/etc/pki/containers/kidnix.pub \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}" >/dev/null

      # Every push adds a ~7 GB version; keep the registry from growing
      # without bound. Untagged versions are signature/attestation leftovers
      # and sha-only builds; tagged `latest`/date tags are kept by the count.
      - name: Prune old image versions
        if: github.event_name != 'pull_request'
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
