<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>One last little thing</title>
  <!-- One more small thing: a single little tile added beside what is already
       there. Deliberately not a "+" (an adult sign) and not a digit (spec 7b:
       no digits anywhere a child looks). -->
  <rect x="6" y="18" width="28" height="28" rx="5" fill="#0f8a8a" stroke="#16181d" stroke-width="3.5"/>
  <rect x="40" y="30" width="18" height="16" rx="4" fill="#f06292" stroke="#16181d" stroke-width="3.5"/>
</svg>
