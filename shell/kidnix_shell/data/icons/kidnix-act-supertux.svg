<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <!-- SPDX-License-Identifier: Apache-2.0
       Copyright kidnix contributors. Activity tile: Jump and run (supertux).
       A child-shaped figure airborne over a gap - the verb, not the mascot. Both
       feet are clear of both platforms, which is what makes it a jump and not a stand.
       The platforms are inset to x=5..23 and x=41..59 so their 3.5 strokes land at
       3.25 and 60.75: every other tile in this set keeps a ~4 unit margin, and this
       one used to run its green flush into both canvas edges, which inside a bordered
       tile reads as a cropped picture rather than as a gap (icon audit, item 10). -->
  <title>Jump and run</title>
  <rect x="5" y="50" width="18" height="10" rx="3" fill="#2e7d32" stroke="#16181d"
        stroke-width="3.5"/>
  <rect x="41" y="50" width="18" height="10" rx="3" fill="#2e7d32" stroke="#16181d"
        stroke-width="3.5"/>
  <path d="M27 23 L16 19 M37 23 L46 13" stroke="#16181d" stroke-width="4.5"
        stroke-linecap="round"/>
  <path d="M28 33 L17 40 M36 33 L46 38" stroke="#16181d" stroke-width="4.5"
        stroke-linecap="round"/>
  <path d="M32 18 L25 34 H39 Z" fill="#0f8a8a" stroke="#16181d" stroke-width="3"
        stroke-linejoin="round"/>
  <circle cx="32" cy="11" r="7.5" fill="#f6c9a8" stroke="#16181d" stroke-width="3.5"/>
</svg>
