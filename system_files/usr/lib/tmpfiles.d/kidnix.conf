# /var is machine-local in a bootc image, so home directories and
# AccountsService state have to be created at boot rather than shipped.
# systemd-sysusers runs first, so kid/parent already resolve here.

d /var/home 0755 root root - -

# `C` seeds from /etc/skel only when the target does not already exist, so a
# real child's home is never clobbered by an upgrade.
C /var/home/kid    0700 kid    kid    - /etc/skel
C /var/home/parent 0700 parent parent - /etc/skel

# GDM reads the per-user default session from AccountsService, not from the
# desktop file alone. Without this, autologin lands in the GNOME session.
d /var/lib/AccountsService 0755 root root - -
d /var/lib/AccountsService/users 0700 root root - -
C /var/lib/AccountsService/users/kid 0600 root root - /usr/share/kidnix/accountsservice-kid
