# The two directories Letters needs, created at boot rather than shipped.
#
# `/var` is machine-local in a bootc image -- nothing under it travels in the
# container -- so a directory a child's activity writes to has to be made by
# systemd-tmpfiles on the machine. `d /var/lib/kidnix` itself is owned by
# kidnix-lockdown.conf and kidnix-library.conf; tmpfiles executes items in
# *path* order across every fragment, so the parent exists before these lines
# run whichever filename sorts first.
#
# WHY THIS LANDS BEFORE THE ACTIVITY DOES. `letters_to_family.mailbox` degrades
# correctly when the outbox is missing -- the Journal entry is written first and
# always, and `post()` returns None with a line in the log rather than losing a
# child's letter. That is the right failure and it is not the right *default*:
# a grown-up who is told "your child made you a letter" and finds nothing on the
# disk has been failed by the machine, not by the child.
#
# THE MODES ARE THE POLICY, not decoration.
#
# The outbox is the child's. They write it, and nothing else on the machine has
# any business reading a five-year-old's letters casually: 0750 kid:kid keeps it
# off every other login on the box. A grown-up reads it through the parent
# account, which is in `wheel` -- the same route they take to everything else of
# their child's that is not theirs by default.
#
# The inbox is the grown-up's, in the other direction: they drop a reply in, the
# child's activity reads it and plays it. So it is owned by `parent` and the
# `kid` group gets r-x and no more. The child cannot write a reply to
# themselves, which is not a security boundary so much as an honesty one -- the
# "Letters for you" shelf must only ever show something a person actually sent.
#
# Both are `d`, not `C`: they start empty, and an upgrade must never seed,
# clear or reset either of them. See docs/design/letters-to-family.md and
# activities/letters_to_family/letters_to_family/mailbox.py.

d /var/lib/kidnix        0755 root   root -
d /var/lib/kidnix/outbox 0750 kid    kid  -
d /var/lib/kidnix/inbox  0750 parent kid  -
