# The family photographs the child's screen is allowed to see.
#
# WHY THIS DIRECTORY EXISTS AT ALL. The parent panel's Family tab lets a
# grown-up pick a photograph of Granny, and the Letters activity draws it as
# the face a child presses to choose who a letter is for. The panel used to
# store the path of whatever the file chooser returned, which is almost always
# somewhere under /var/home/parent -- and that home is 0700 parent:parent
# (tmpfiles.d/kidnix.conf), so `kid` cannot stat it, let alone read it. The
# activity's `Recipient.photo_path` caught the resulting PermissionError and
# returned None, the tile fell back to the drawn placeholder face, and nothing
# anywhere said why. A grown-up who had chosen four photographs saw four
# identical drawn faces and had no way to find out what had gone wrong.
#
# So the panel copies the file here on Apply and writes THIS path instead.
#
# THE OWNERSHIP IS THE POLICY.
#
# `parent`, not root: the copy is made by the parent panel, which runs as the
# grown-up and not as root. That is deliberate and it is a security property,
# not a convenience -- a root helper that copied a caller-named path into a
# world-readable directory would copy anything the caller could name and could
# not read, /etc/shadow included. The unprivileged process copies only what the
# person driving it can already read.
#
# 0755 and the files inside 0644: `kid` has to READ these, and read is all. A
# child cannot add a face to their own list of people they may write to -- that
# list is a grown-up's (docs/design/letters-to-family.md; SYNTHESIS G1) -- and
# the directory being unwritable to them is what enforces it.
#
# `d`, not `C`: it starts empty and an upgrade must never seed, clear or reset
# it. The photographs in here are a household's own.
#
# /var/lib/kidnix itself is created by kidnix-lockdown.conf and
# kidnix-letters.conf as well; systemd-tmpfiles processes items in *path* order
# across every fragment, so the parent directory exists before this line runs
# whichever filename sorts first.

d /var/lib/kidnix        0755 root   root   -
d /var/lib/kidnix/photos 0755 parent parent -
