# Where a parent drops offline content for a Library activity (Kiwix ZIMs).
#
# **THERE IS NO LIBRARY TILE TODAY.** `kiwix.toml` was deleted on 2026-08-23:
# its `exec` was `kiwix-serve`, which is a headless HTTP daemon, and this image
# has no viewer to point at it and no web browser by policy. A tile that starts
# a server and shows a child nothing is worse than no tile, and
# `content_required` only hid the problem while the directory was empty -- the
# first parent to drop a ZIM in here would have found the trap.
#
# This directory stays for two reasons: a machine that already has ZIMs in it
# must not lose them to an upgrade, and it is the path the viewer work will
# pick up from (docs/design/shell-v0.1-implementation-notes.md 16.2, 16.12
# item 2). `kiwix-tools` is still installed; see build_files/50-activities.sh.
#
# /var is machine-local and writable in a bootc image and upgrades leave it
# alone, so this is created at boot rather than shipped in the image. It is
# root-owned and world-readable: the *parent* fills it from their own account
# with sudo, and the child (who reads it through kiwix-serve) cannot empty it.

d /var/lib/kidnix         0755 root root -
d /var/lib/kidnix/library 0755 root root -
