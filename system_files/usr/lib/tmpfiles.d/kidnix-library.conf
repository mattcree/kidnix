# Where a parent drops offline content for the Library activity (Kiwix ZIMs).
#
# `kiwix.toml` declares `content_required = ["/var/lib/kidnix/library/*.zim"]`,
# and `kidnix_shell.activities.Availability.has_content()` hides the Library
# tile entirely until that glob matches something -- a button that opens an
# empty library is worse than an absent one (docs/design/shell-v0.1
# -implementation-notes.md 16.2). Without this file the directory does not
# exist, so a parent has nowhere obvious to put the ZIM: 16.12 item 2.
#
# /var is machine-local and writable in a bootc image and upgrades leave it
# alone, so this is created at boot rather than shipped in the image. It is
# root-owned and world-readable: the *parent* fills it from their own account
# with sudo, and the child (who reads it through kiwix-serve) cannot empty it.

d /var/lib/kidnix         0755 root root -
d /var/lib/kidnix/library 0755 root root -
