# The parent's default session, seeded into AccountsService on first boot.
#
# /var/lib/AccountsService is machine-local in a bootc image, so this cannot be
# a file in the container -- see system_files/usr/lib/tmpfiles.d/kidnix.conf,
# which does the same for `kid` and which owns the `d` lines that create and
# chmod the directories below. systemd-tmpfiles executes items in *path* order
# across every fragment, so those directories exist before this line runs no
# matter which filename sorts first.
#
# `C` copies only when the target does not already exist, so a parent who later
# picks a different session in GDM keeps it across upgrades.
C /var/lib/AccountsService/users/parent 0600 root root - /usr/share/kidnix/accountsservice-parent
