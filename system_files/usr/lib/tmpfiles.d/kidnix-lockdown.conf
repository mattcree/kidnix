# Lockdown state that has to live in /var, and therefore cannot be shipped in
# the image itself. See system_files/usr/lib/tmpfiles.d/kidnix.conf for the
# same pattern applied to home directories and AccountsService.
#
# `C` copies only when the target does not already exist, so a parent's later
# edits survive every upgrade.

# The system Flatpak installation, with network sharing off by default.
d /var/lib/flatpak 0755 root root - -
d /var/lib/flatpak/overrides 0755 root root - -
C /var/lib/flatpak/overrides/global 0644 root root - /usr/share/kidnix/flatpak/overrides-global

# Where the audio cap records the mixer state it applied, and where later
# milestones (timekeeper, journal) will keep machine-local kidnix state.
d /var/lib/kidnix 0755 root root - -
