# GCompris' settings file is per-user by construction and therefore cannot be
# shipped read-only in /usr.
#
#   src/core/main.cpp:
#     QSettings config(QStandardPaths::writableLocation(
#                          QStandardPaths::GenericConfigLocation)
#                      + "/gcompris/" + GCOMPRIS_APPLICATION_NAME + ".conf",
#                      QSettings::IniFormat);
#
# GenericConfigLocation is $XDG_CONFIG_HOME (default ~/.config), so the one and
# only path GCompris will read is ~/.config/gcompris/gcompris-qt.conf. There is
# no system-wide fallback: QSettings::IniFormat with an explicit filename does
# not consult XDG_CONFIG_DIRS, and GCompris never calls QSettings::setPath().
# Seeding at boot is the only option. Verified in the image.
#
# GCompris rewrites this file on every exit (QSettings::sync), so it must be a
# real writable copy, not a symlink into /usr -- a symlink would either be
# followed and fail on the read-only root, or be replaced by a plain file the
# first time the child quits.
#
# See docs/spikes/gcompris-curation.md for the upgrade trade-off this makes.

# /var/home/kid itself is created by kidnix.conf. That file sorts *after* this
# one by filename ('-' < '.'), which would matter if tmpfiles ran files in name
# order -- it does not. systemd-tmpfiles collects every entry and processes them
# by path, parents before children. Verified with `systemd-tmpfiles --create
# --root=` over just these two files: /var/home/kid still comes out kid-owned
# with /etc/skel copied in, and only then are the directories below created.
d /var/home/kid/.config          0700 kid kid - -
d /var/home/kid/.config/gcompris 0700 kid kid - -

# `C` copies only when the target does not already exist, so an upgrade never
# clobbers a child's level progress ([Levels]) or a parent's later edits. Same
# contract as kidnix.conf and kidnix-lockdown.conf.
C /var/home/kid/.config/gcompris/gcompris-qt.conf 0600 kid kid - /usr/share/kidnix/gcompris/gcompris-qt.conf

# The generation of the shelf this home was seeded from. `C` means it too is
# written once, so on an upgrade it holds the OLD generation while
# /usr/share/kidnix/gcompris/GENERATION holds the new one -- which is exactly
# the signal a re-seed unit needs. Nothing consumes it yet; see the spike doc.
C /var/home/kid/.config/gcompris/.kidnix-generation 0600 kid kid - /usr/share/kidnix/gcompris/GENERATION

# GCompris writes its own runtime state (downloaded-asset cache index, saved
# drawings) under these. Pre-creating them owned by kid keeps the first run from
# racing with anything else in the session.
d /var/home/kid/.local             0700 kid kid - -
d /var/home/kid/.local/share       0700 kid kid - -
d /var/home/kid/.local/share/GCompris 0700 kid kid - -
