# What the kidnix session is made of.
#
# Drop-in on the `gnome-session@kidnix.target` instance -- this is where a
# systemd-managed gnome-session gets its component list (gnome-session's own
# gnome-session@gnome.target.d/gnome.session.conf and gnome-kiosk's
# gnome-session@gnome-kiosk-script.target.d/session.conf are the two reference
# copies on this image).
#
# Starting this target is what finally activates `graphical-session.target`:
#   gnome-session@kidnix.target
#     -> Requires gnome-session-initialized.target -> gnome-session.target
#        -> BindsTo graphical-session.target
# and `graphical-session.target` being active is precisely what
# xdg-desktop-portal{,-gnome,-gtk}.service need (they carry
# `Requisite=graphical-session.target`, which fails instantly if the target is
# not *already* active). Exec'ing gnome-kiosk directly, as v0.1 did, never
# raised it -- see docs/BUILDING.md "Known: no portals in the kid session".
[Unit]
# The compositor. Genuinely required: without it there is no display server
# and nothing else in the session can work.
Requires=org.gnome.Kiosk.target

# The shell is deliberately Wants=, not Requires=. If the shell cannot start,
# the child should be left with a live compositor and a unit that keeps
# retrying (Restart=always), not a session that tears itself down and bounces
# them through GDM. See kidnix-shell.service.
Wants=kidnix-shell.service

# gnome-settings-daemon components the child session actually uses.
# A11ySettings starts Orca when the a11y keys say so; MediaKeys is what makes
# the volume and brightness keys on a real keyboard work; Sound keeps the
# sound theme cache honest. Everything else gsd offers (printing, colour,
# smartcards, housekeeping notifications, wwan, usb-protection) is either
# noise a five-year-old must never see or surface area we do not want.
Wants=org.gnome.SettingsDaemon.A11ySettings.target
Wants=org.gnome.SettingsDaemon.MediaKeys.target
Wants=org.gnome.SettingsDaemon.Sound.target
