# Cap what the journal remembers about a five-year-old.
#
# docs/design/reviews/2026-08-23-safety-privacy-expert.md, MAJOR (#32 in the
# forum): the shell logs one INFO line per hover utterance and one line per PIN
# attempt, both with wall-clock timestamps. Together that is "a continuous
# timestamped trace of where a five-year-old's pointer hesitated and whether
# they followed through" -- and systemd's persistent journal has no retention
# cap out of the box, so it would be kept for the life of the disk and would
# survive any "delete everything" the Journal ever grows.
#
# The instrumentation itself is off by default now (/etc/kidnix/research.toml).
# This file is the second half: even with it on, nothing about a child's
# session survives a month, and the whole journal is bounded so a laptop that
# is never looked at cannot fill its disk with a record of a child.
#
# 30 days is chosen to be shorter than a school term and longer than the
# "something went wrong last week, what happened?" window a parent actually
# needs. SystemMaxUse is a hard ceiling that bites first on a busy machine.
#
# /usr/lib rather than /etc so bootc owns it and an upgrade reinstates it; a
# parent who wants different numbers drops a file in
# /etc/systemd/journald.conf.d/, which sorts later and wins.
[Journal]
Storage=persistent
MaxRetentionSec=30day
SystemMaxUse=200M
SystemMaxFileSize=20M
MaxFileSec=1day
# Never forward a child's session log to a syslog daemon, a console or the
# kernel ring buffer -- three more copies with three more retention rules.
ForwardToSyslog=no
ForwardToWall=no
