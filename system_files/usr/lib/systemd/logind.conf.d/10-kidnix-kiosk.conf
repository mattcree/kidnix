# kidnix: remove the virtual terminals a child could land on.
#
# Image-owned drop-in. systemd-logind reads logind.conf.d from (in ascending
# priority) /usr/lib, /usr/local/lib, /run and /etc, so a parent can still
# override this on a running machine by dropping a file in
# /etc/systemd/logind.conf.d/ -- verify what is actually in force with
# `systemd-analyze cat-config systemd/logind.conf`.
#
# WHAT THIS DOES
#   NAutoVTs=0   stops logind auto-spawning autovt@ttyN (default 6) when a VT
#                is activated. Nothing is listening on tty2..tty6.
#   ReserveVT=0  releases the VT logind normally keeps in reserve (default 6).
#
# WHAT THIS DOES *NOT* DO
#   It does not stop the Ctrl+Alt+F<n> keystroke reaching the kernel VT layer.
#   A child mashing keys can still switch to an empty console and see a black
#   screen. Two other layers cover that, and both are more important than this
#   one:
#     1. the dconf lockdown blanks
#        org.gnome.mutter.wayland.keybindings switch-to-session-1..12, which is
#        where mutter (and therefore gnome-kiosk) actually implements the
#        Ctrl+Alt+F<n> grab on Wayland;
#     2. the polkit lockdown denies org.freedesktop.login1.chvt to kid.
#   That combination is unverified on real hardware -- see
#   docs/spikes/lockdown.md and docs/research/07-linux-stack.md risk #7.
#
# RECOVERY IS INTACT: getty@tty1.service is enabled by preset independently of
# NAutoVTs, so booting with `systemd.unit=multi-user.target` (or `3`) from the
# GRUB menu still gives a parent a real login prompt.
#
# NOT set here, deliberately: KillUserProcesses=yes. Research 07 §2.3 wants it
# for clean time-limit termination, but it also kills a parent's detached
# tmux/ssh work and belongs with the timekeeper milestone, not this one.

[Login]
NAutoVTs=0
ReserveVT=0
