# kidnix accounts, created idempotently on every boot by systemd-sysusers.
# Existing names are left alone, so an installer-created `parent` (with a
# password) wins over these definitions. See build_files/20-users.sh.
#
# Type Name    ID          GECOS                    Home            Shell
g      kid     1000        -                        -               -
u      kid     1000:1000   "kidnix child account"   /var/home/kid   /bin/bash
g      parent  1001        -                        -               -
u      parent  1001:1001   "kidnix parent account"  /var/home/parent /bin/bash

# Parents administer the machine; kid deliberately gets no privileged groups.
m      parent  wheel
