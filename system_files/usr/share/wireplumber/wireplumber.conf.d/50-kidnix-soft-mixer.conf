# kidnix: stop PipeWire from touching the hardware mixer.
#
# This is half of the audio safety story (docs/research/07-linux-stack.md
# §2.4). The other half is /usr/libexec/kidnix-audio-cap, which sets the ALSA
# `Master` control to a safe ceiling once at boot.
#
# `api.alsa.soft-mixer = true` makes the ALSA node do its volume in software
# and leave the card's own mixer controls alone. Without it, the first
# application (or WirePlumber restoring a saved stream volume) pushes the
# hardware Master back to 100% and the boot-time cap evaporates. With it, the
# hardware ceiling is genuinely a ceiling: everything PipeWire does is
# attenuation *below* it.
#
# WHY THIS MATTERS FOR A CHILD: headphones on a laptop at 100% are loud enough
# to cause real harm, and a 5-year-old will find the volume keys within a day.
# Research 06 §7.4 spec 26: "nothing above conversational level."
#
# Syntax is WirePlumber 0.5 SPA-JSON (Lua survives only for scripts). Modelled
# on the shipped /usr/share/wireplumber/wireplumber.conf.d/alsa-vm.conf.
#
# NOT VERIFIED WITHOUT HARDWARE: whether every card exposes a control named
# `Master`, and whether soft-mixer costs measurable CPU on the low-end targets
# in research 06 §3.1. See docs/spikes/lockdown.md.

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
