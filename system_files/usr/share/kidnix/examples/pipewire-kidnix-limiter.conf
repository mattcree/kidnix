# STAGED, NOT ACTIVE. Copy to /usr/share/pipewire/pipewire.conf.d/ (or
# /etc/pipewire/pipewire.conf.d/ on a running machine) to enable.
#
# The third loudness-safety mechanism from docs/research/07-linux-stack.md
# §2.4: a filter-chain virtual sink that attenuates by 0.6 and then hard-clamps
# at +/-0.8, so no stream can produce a full-scale sample no matter what the
# mixers say. PipeWire 1.6's filter-chain builtins are clamp / linear /
# noisegate / ramp / biquads / convolver -- there is no lookahead limiter, so
# this is attenuate-then-clip, not real limiting. A proper limiter needs
# ladspa-swh-plugins (fast lookahead limiter), which is not in the image.
#
# WHY IT IS NOT ENABLED BY DEFAULT
# A filter-chain sink has to be *linked* to the real hardware sink, and getting
# WirePlumber to make it the default without creating a loopback loop is
# exactly the kind of thing that cannot be verified from inside a build
# container with no sound card and no session bus. The failure mode of getting
# it wrong is a child's computer with no sound at all, which is strictly worse
# than a computer that is occasionally too loud -- and the ALSA hardware cap
# (/usr/libexec/kidnix-audio-cap) already provides an unbypassable ceiling.
#
# TO FINISH THIS: boot a VM with an emulated sound card, enable this file,
# then check `wpctl status` shows kidnix-safe-output as the default sink and
# that audio actually reaches the speakers. Track it in docs/spikes/lockdown.md.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "kidnix safe output"
      media.name       = "kidnix safe output"
      filter.graph = {
        nodes = [
          { type = builtin  name = attenuate_l  label = linear
            control = { "Mult" = 0.6  "Add" = 0.0 } }
          { type = builtin  name = attenuate_r  label = linear
            control = { "Mult" = 0.6  "Add" = 0.0 } }
          { type = builtin  name = clamp_l  label = clamp
            control = { "Min" = -0.8  "Max" = 0.8 } }
          { type = builtin  name = clamp_r  label = clamp
            control = { "Min" = -0.8  "Max" = 0.8 } }
        ]
        links = [
          { output = "attenuate_l:Out"  input = "clamp_l:In" }
          { output = "attenuate_r:Out"  input = "clamp_r:In" }
        ]
        inputs  = [ "attenuate_l:In" "attenuate_r:In" ]
        outputs = [ "clamp_l:Out" "clamp_r:Out" ]
      }
      capture.props = {
        node.name   = "kidnix-safe-output"
        media.class = Audio/Sink
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name   = "kidnix-safe-output-playback"
        node.passive = true
        audio.position = [ FL FR ]
      }
    }
  }
]
