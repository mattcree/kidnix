<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <!-- SPDX-License-Identifier: Apache-2.0
       Copyright kidnix contributors. GCompris shelf tile: Sound pairs (memory-sound).

       This used to be `memory`'s exact three-card layout with teal sound arcs where the
       other tile has pink dots. That is the honest description of the two activities and
       it was the wrong drawing: the two tiles measured 0.88 correlated at 32x32 grey and
       they sit on the SAME shelf, so at 72 px a pre-reader had a recolour to go on and
       nothing else (icon audit, items 3d and 11).

       The fix is not a different colour, it is a different subject. `memory` is about the
       cards — three of them, spread across the tile, one still face down. This one is
       about the NOISE: two cards of a matched pair, stacked to one side and small, and
       the sound leaving them as the biggest mark on the tile. Different silhouette,
       not a different palette. -->
  <title>Sound pairs</title>
  <rect x="6" y="16" width="24" height="34" rx="4" fill="#fbf7ef" stroke="#16181d"
        stroke-width="3" transform="rotate(-10 18 33)"/>
  <rect x="14" y="22" width="24" height="34" rx="4" fill="#fbf7ef" stroke="#16181d"
        stroke-width="3"/>
  <g fill="none" stroke="#0f8a8a" stroke-width="4.5" stroke-linecap="round">
    <path d="M40 32 A6 6 0 0 1 40 44"/>
    <path d="M40 27 A11 11 0 0 1 40 49"/>
    <path d="M40 22 A16 16 0 0 1 40 54"/>
  </g>
</svg>
