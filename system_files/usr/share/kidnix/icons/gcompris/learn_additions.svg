<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <!-- SPDX-License-Identifier: Apache-2.0
       Copyright kidnix contributors. GCompris shelf tile: Adding up (learn_additions).
       The ACTION: two lots you can SEE, and one arrow putting the small lot in with the big
       one. Deliberately NOT a row of beads - kidnix-act-tuxmath.svg owns beads-on-a-wire -
       and deliberately not two arrows meeting, which drew a large X and read as 'wrong'.
       NO ARITHMETIC SIGNS: a pre-reader can no more read '+' than a word. -->
  <title>Adding up</title>
