    <circle cx="12" cy="20" r="8"/>
    <circle cx="12" cy="42" r="8"/>
  </g>
  <g fill="#f06292" stroke="#16181d" stroke-width="3">
    <circle cx="52" cy="14" r="7"/>
    <circle cx="52" cy="32" r="7"/>
    <circle cx="52" cy="50" r="7"/>
  </g>
  <g fill="none" stroke="#0f8a8a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 34 C29 26 34 25 41 29"/>
    <path d="M35 26 L42 29 L37 34"/>
  </g>
