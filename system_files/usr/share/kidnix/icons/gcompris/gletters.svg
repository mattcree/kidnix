<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <!-- SPDX-License-Identifier: Apache-2.0
       Copyright kidnix contributors. GCompris shelf tile: Type the letter (gletters).
       The ACTION: a letter falling towards the ground, with speed ticks that say it will not
       wait. This is the one game on the shelf that can be lost, and the falling is the
       reason - so the falling is what the tile shows. Paths, not <text>. -->
  <title>Type the letter</title>
  <g stroke="#16181d" stroke-width="3.2" stroke-linecap="round">
    <path d="M10 8 V17"/>
    <path d="M54 5 V14"/>
  </g>
  <rect x="21" y="22" width="22" height="22" rx="5" fill="#ffd23f" stroke="#16181d" stroke-width="3.2"/>
  <g fill="none" stroke="#16181d" stroke-width="2.8" stroke-linecap="round">
    <circle cx="30" cy="35" r="4.4"/>
    <path d="M34.4 31 V39"/>
  </g>
  <rect x="4" y="51" width="56" height="9" rx="4" fill="#8a93b5" stroke="#16181d" stroke-width="3.2"/>
</svg>
