<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- SPDX-License-Identifier: Apache-2.0
       Copyright kidnix contributors. GCompris shelf tile: Big and small letters
       (memory-case-association). The OUTPUT: the two shapes of one letter, tied together.
