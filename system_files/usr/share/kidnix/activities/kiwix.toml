# kidnix activity manifest -- schema documented in docs/spikes/activities-packaging.md.
schema = 1

id = "kiwix"
name = "Library"
audio_label = "Library"
goal = "Looking things up in an offline encyclopedia a grown-up has added. Nothing to read until they do."
order = 100
# No icon ships with kiwix-tools (it is a server, not an app). Placeholder until
# the shell has its own icon set.
icon = "accessories-dictionary"
icon_kind = "icon-name"
# kiwix-serve is a daemon, not a window. The shell starts it against the parent's
# ZIM library and renders the result in its own view; the viewer is TBD.
exec = ["kiwix-serve", "--port=8172", "--library", "/var/lib/kidnix/library/library.xml"]

category = "learn"
age_min = 5
age_max = 12
oars_rating = "none"
# Serves purely from local ZIM files over loopback. No egress.
network_required = false
# Nothing to show until a parent adds a ZIM: the shell must hide this tile when
# the library file is missing rather than opening an empty book.
content_required = true

source = "rpm"
package = "kiwix-tools"
licence = "GPL-3.0-or-later"
journal_watch = []
# Not applicable: no window of its own. The viewer's toolkit decides.
wayland_native = false

notes = """
docs/research/07 §4 item 13: kiwix-desktop's Flathub build is 20 months stale on an
EOL KDE runtime. Fedora 44 does package kiwix-desktop 2.5.1, but it drags 438 MiB of
Qt5 for a UI a child should not see anyway -- so we ship kiwix-tools (7 MiB,
kiwix-serve) and let the kidnix shell be the viewer.

VIEWER IS TBD and is the main open question here: something has to render
http://127.0.0.1:8172/ in a way that is not a web browser (non-negotiable: no web
browser). WebKitGTK in the shell is the obvious candidate.

Content is not shipped: the practical kid bundle from the research is
wikipedia_en-simple_all_mini (450 MB) + vikidia_en_all_nopic (8 MB), which the
parent adds. Baking 458 MB of encyclopedia into every image is not defensible until
someone has watched a five-year-old use it.
"""
