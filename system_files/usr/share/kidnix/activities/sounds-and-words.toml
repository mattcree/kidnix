# Sounds & words -- the first kidnix-written activity to reach a tile.
#
# The source of truth for this file is
# `activities/sounds_and_words/manifest.toml`, which is what
# `activities/sounds_and_words/tests/test_manifest.py` validates in CI. This is
# the copy the image ships. Everything a child or a parent can perceive is the
# same in both -- name, audio_label, goal, category, age band, exec, quit,
# network -- and stage 64 asserts that field by field at build time. What is
# only here is what is a fact about the *image* rather than about the activity:
#
#   * `order`, which only means anything next to the other tiles;
#   * `icon`, an absolute path only the image knows
#     (build_files/64-first-party-activities.sh installs it there); and
#   * the packaging fields build_files/50-activities.sh's validator requires of
#     every tile -- source, package, licence, age_min/age_max, oars_rating,
#     journal_watch, wayland_native, notes.
#
# `build_files/60-shell.sh` runs `kidnix-shell-app --validate-manifests` over
# this directory and `build_files/64-first-party-activities.sh` runs
# `kidnix-activity validate` over this file, which is the stricter of the two:
# it also insists on quit="signal", network_required=false, a goal, an
# audio_label and an icon (docs/design/activity-sdk.md §9).
schema = 1

id = "sounds-and-words"
name = "Sounds & words"

# What the shell says when a child hovers or focuses the tile. Written for the
# ear, and it says what *happens* -- the goal line below is for the grown-up.
audio_label = "Sounds and words. Find the sound, then push the sounds together to make a word."

# One honest line for a parent, copied verbatim from the activity's own
# manifest, and the sentence the whole activity is held to
# (docs/design/sounds-and-words.md §0). It does not claim to teach reading.
goal = "Practises the letter sounds the school has already taught. The sounds are spoken by the computer voice, not recorded by a person. Not a reading programme."

# Second on Home, immediately after Draw (tuxpaint, order = 10).
#
# Draw stays first deliberately: tests/e2e/test_scenario.py opens "the first
# cell of the first row" and asserts the launcher log says Draw, so a tile that
# sorted ahead of order = 10 would break the scenario rather than silently
# starting something else. 15 leaves room either side without renumbering
# anything.
order = 15

# A path, not an icon name. The drawing lives with the activity that owns it
# (`sounds_and_words/icon.svg` in the package) rather than in the shell's own
# bundled set, and the build copies it to this stable path -- the shell's
# `widgets.icon_image` loads `icon_kind = "path"` with `Gtk.Image.new_from_file`,
# so an absolute path is exactly what it wants.
icon = "/usr/share/kidnix/icons/sounds-and-words.svg"
icon_kind = "path"

kind = "activity"
category = "learn"
# Overlap, not containment: a 4-5 profile and a 6-8 profile both see this.
# Reception and Year 1 are where a UK phonics progression actually lives.
#
# Both spellings, because two validators read this file and each insists on a
# different one: build_files/50-activities.sh requires the explicit integers,
# the shell's parser prefers the band. They must agree, and
# kidnix_shell.activities.parse_manifest lets the explicit pair win.
age_band = "4-6"
age_min = 4
age_max = 6

# The console script build_files/64-first-party-activities.sh writes. No
# arguments: `--ceiling` exists for regenerating screenshots and a child's
# session must not be able to reach it (docs/design/sounds-and-words.md §12.7).
exec = ["/usr/bin/kidnix-sounds-and-words"]

# The SDK saves on SIGTERM and never shows a quit dialogue
# (kidnix_activity.lifecycle; docs/design/activity-sdk.md §3.3). Five seconds is
# spec 7a's autosave grace, and what it covers here is one JSON file and one
# small PNG.
quit = "signal"
quit_grace = 5.0

oars_rating = "none"
# The child session has no egress (SYNTHESIS H1), and this activity has no use
# for it: the corpus is on disk and there is no account, no sync and no model.
network_required = false

# No journal_watch and no journal_glob, deliberately. The activity writes its
# own entry with kidnix_activity.journal.save_entry, so there is nothing for the
# shell's importer to notice two seconds later -- and an importer watching a
# scratch directory would keep the same card twice
# (docs/design/activity-sdk.md §8).
journal_watch = []

wayland_native = true

# Neither an RPM nor a Flatpak: this one is ours, installed by
# build_files/64-first-party-activities.sh. `kidnix` is the third value
# build_files/50-activities.sh's validator learned for this wave.
source = "kidnix"
package = "kidnix-sounds-and-words"
licence = "Apache-2.0"

notes = """
Ours. The Python package is installed beside the shell by
build_files/64-first-party-activities.sh, not by an RPM.

Corpus: Letters and Sounds (2007), DFES-00281-2007, (c) Crown copyright 2007,
Open Government Licence v3.0 -- see docs/LICENSES.md and
activities/sounds_and_words/LICENSES.md. L&S is NOT on the DfE's validated
list and kidnix must never describe it as a validated programme; it is used as
a default ordering and a licensed word corpus.

Every phoneme a child hears today is still a placeholder spoken by the ordinary
voice: /usr/share/kidnix/phonemes/en_GB/phonemes.toml is the ledger that says
so, one row per grapheme-phoneme correspondence.
"""
