# kidnix activity manifest -- schema documented in docs/spikes/activities-packaging.md.
schema = 1

id = "tuxpaint"
name = "Draw"
# Read aloud by the shell when the tile is focused. The label a pre-reader gets
# is what they DO here, not what the program is called (SYNTHESIS B4, 05 s3):
# 'Draw', never 'Tux Paint'. audio_label exists because the written label and
# the spoken one sometimes have to differ ('Letters & numbers' does not speak).
audio_label = "Draw"
goal = "Making pictures -- no right answers. Autosaves; a child is never asked whether to save."
order = 10
icon = "tuxpaint"
icon_kind = "icon-name"
# No flags. Everything Tux Paint needs is in /etc/tuxpaint/tuxpaint.conf, which
# build_files/50-activities.sh writes (it cannot live in system_files/: the
# tuxpaint RPM owns that path as a %config file and the dnf transaction would
# clobber an overlay copy).
#
# The line that matters for this manifest is `noquit=yes`, which hides Tux
# Paint's own Quit tool and disables its [Escape] binding, retiring ADR-0010 #5:
# that dialogue ("Do you really want to quit?", two lines of text a pre-reader
# cannot read) only existed because the child had no other way out. Since v0.1.5
# the band stays on screen over an activity, so **Back in the band is the way
# out** -- it sends SIGTERM, SDL turns that into a quit event, Tux Paint
# autosaves (`autosave=yes`) and the Journal keeps the drawing. One exit, always
# in the same place, in the shell's chrome rather than in each activity.
# An adult still has Alt+F4 and Shift+Ctrl+Escape, per tuxpaint(1).
exec = ["tuxpaint"]

category = "make"
age_min = 3
age_max = 10
# OARS 1.1. Nothing to declare: no violence, no chat, no purchases, no ads.
oars_rating = "none"
network_required = false

source = "rpm"
package = "tuxpaint"
licence = "GPL-2.0-or-later"

# Verified in tuxpaint(1) FILES: "$HOME/.tuxpaint/saved/ -- a directory of
# previously-saved images (and thumbnails)". The export dir is separate and only
# used from the Open dialog, but the Journal should notice both.
journal_watch = ["~/.tuxpaint/saved", "~/Pictures/TuxPaint"]

# SDL-based. Fedora 44's SDL runtime prefers the Wayland video driver, so no
# XWayland round-trip -- but this is inferred from the SDL default, not observed
# in a running kiosk. See "open questions" in the spike doc.
wayland_native = true

notes = """
The clearest 'making over consuming' activity we ship, and the one a four-year-old
gets furthest with unaided. System-wide config is written to /etc/tuxpaint/tuxpaint.conf
by build_files/50-activities.sh (fullscreen=native, saveovernew, autosave, nolockfile):
a child is never asked to overwrite their own work and never asked whether to save.
Stamps come from the separate 193 MiB tuxpaint-stamps package and are most of the fun.
"""
