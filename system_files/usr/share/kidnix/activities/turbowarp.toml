# kidnix activity manifest -- schema documented in docs/spikes/activities-packaging.md.
schema = 1

id = "turbowarp"
name = "Make a game"
audio_label = "Make a game"
goal = "Building something that runs, out of picture blocks. Realistically a six-plus activity."
order = 30
# The Flatpak is installed by kidnix-flatpaks-firstboot.service on the first
# online boot, and until that has happened `flatpak run` exits 1 in under a
# second. False means: no tile at all until it is really there. A tile that
# flickers and returns the child to Home is worse than an absent one
# (docs/spikes/e2e-scenario.md s3.1). Flip to true once the icon and the
# install path are both proven, so the child at least gets an outline.
show_when_unavailable = false
icon = "org.turbowarp.TurboWarp"
icon_kind = "icon-name"
exec = ["flatpak", "run", "org.turbowarp.TurboWarp"]

category = "make"
age_min = 6
age_max = 12
oars_rating = "none"
# Fully offline once installed -- but it has to be installed once, over the
# network, by kidnix-flatpaks-firstboot.service.
network_required = false

# The only activity in the first wave that is NOT an RPM: Fedora packages no
# Scratch-alike, there is no supported Linux ScratchJr, and edu.mit.Scratch is
# abandoned on an EOL runtime.
source = "flatpak"
package = "org.turbowarp.TurboWarp"
licence = "GPL-3.0-or-later"

# Saves .sb3 project files through a portal file dialog, so the destination is
# whatever the portal offers. Needs a fixed home before the Journal can watch it.
journal_watch = []
wayland_native = true

notes = """
Present only if kidnix-flatpaks-firstboot.service has had one online boot; the shell
must check before showing the tile. 382 MB installed.

Requires `flatpak override --system --unshare=network org.turbowarp.TurboWarp` (or
the global override the lockdown work ships) once installed -- TurboWarp works
entirely offline and must not be allowed to reach the internet from a child session.
"""
