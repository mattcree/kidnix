# kidnix activity manifest -- schema documented in docs/spikes/activities-packaging.md.
schema = 1

id = "klettres"
name = "Letter names"
audio_label = "Listen to the letter, then press it on the keyboard"
goal = "Listening to letters. The voice says each letter's NAME -- ay, bee, see -- not its phonics sound, so this practises the alphabet, not reading."
order = 50
icon = "kidnix-act-klettres"
icon_kind = "icon-name"
exec = ["klettres"]

category = "learn"
age_min = 4
age_max = 8
oars_rating = "none"
# Ships recorded audio for several languages in the RPM; nothing is fetched.
network_required = false

source = "rpm"
package = "klettres"
licence = "GPL-2.0-or-later"
journal_watch = []
wayland_native = true

notes = """
Alphabet practice with recorded human audio -- it does not assume the child can
already read, which is why it is here at all. ~48 MiB marginal once KF6 is in the
image for KTuberling.

NAMES, NOT SOUNDS -- SETTLED, WITH EVIDENCE (docs/spikes/panel-wave-c.md s3).
The 2026-08-23 early-years-teacher review made this a BLOCKER: the tile was
called "Letter sounds", which is a phonics claim, while the manifest's own notes
admitted nobody had checked. Measured on the shipped /usr/share/klettres/en_GB/
recordings: after trimming silence at -40 dBFS every clip carries 0.33-0.71 s of
continuous speech (t=0.36, p=0.39, k=0.39, b=0.56, d=0.44, w=0.71). An isolated
plosive PHONEME is a burst of 0.1-0.2 s and physically cannot last 0.36 s; a
letter NAME is a full syllable, and /w/ -- the shortest phoneme in the set but
the longest name, "double-u" -- is the longest clip of the twenty-six. These are
letter names. The tile says so.

Two more structural facts that stop this being a phonics activity whatever the
recordings say: sounds.xml presents the alphabet as UPPERCASE A-Z (UK phonics
teaches lowercase graphemes first), and the en_GB "syllables" set for levels 3-4
is 23 whole real words (ARM, BALL, CAR, GEM, THE), not phase-controlled blends.
GEM alone contradicts the hard /g/ a Phase 2 child has just been taught.

/etc/xdg/klettresrc selects en_GB (the kcfg default is "en", the AMERICAN
recordings), turns on kid mode so the text menubar is hidden, and starts at
level 1 -- the only level that shows the letter as well as playing it.
"""
