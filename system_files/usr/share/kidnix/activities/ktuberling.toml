# kidnix activity manifest -- schema documented in docs/spikes/activities-packaging.md.
schema = 1

id = "ktuberling"
name = "Potato faces"
audio_label = "Make a potato face"
goal = "Drag-and-drop play. Every part is spoken aloud, so it needs no reading, and there is no way to lose."
order = 20
icon = "ktuberling"
icon_kind = "icon-name"
exec = ["ktuberling"]

# Spec 7c. "signal", and this one is the honest edge of the contract: KTuberling
# is a Qt/KDE application, KF6 installs handlers only for the crash signals
# (KCrash: SIGSEGV/SIGBUS/SIGFPE/SIGILL/SIGABRT), and nothing anywhere catches
# SIGTERM -- so it dies on the signal and an unsaved potato dies with it. That
# is not a reason to declare "confirm": "confirm" means *the program asks the
# child*, and KTuberling does not. Declaring it would leave the shell waiting
# thirty seconds for a dialogue that never appears and then killing it anyway.
# The real fix is a `journal_watch` and a save path; until then the loss is
# recorded here and in the implementation notes rather than papered over.
quit = "signal"

category = "make"
age_min = 3
age_max = 7
oars_rating = "none"
network_required = false

source = "rpm"
package = "ktuberling"
licence = "GPL-2.0-or-later"

# KTuberling can save a playground to a .tuberling file, but only through a file
# dialog with no fixed default directory -- so there is no reliable path to watch
# until the shell hands it one. Open question in the spike doc.
journal_watch = []

wayland_native = true

notes = """
The single best 4-6 activity in the KDE set: it speaks every part name aloud as you
pick it up, so it needs no reading whatsoever, and there is no way to lose. Drag-and-
drop practice disguised as play. 26.04.3 in Fedora 44.
"""
