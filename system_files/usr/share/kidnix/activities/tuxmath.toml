# kidnix activity manifest -- schema documented in docs/spikes/activities-packaging.md.
schema = 1

id = "tuxmath"
name = "Number game"
audio_label = "Number game"
goal = "Timed arithmetic practice with a score and a game over. Seven and up: it can be lost, which nothing else here can."
order = 60
icon = "kidnix-act-tuxmath"
icon_kind = "icon-name"
exec = ["tuxmath"]

category = "learn"
# Seven, not six. The 2026-08-23 early-years-teacher review (MAJOR) put this
# against principle E1 -- "no points, no scores, no levels" -- in as many words:
# "tuxmath.toml ships timed arithmetic with a score and a game-over ... A
# Reception child hitting GAME OVER on a machine whose premise is 'you cannot
# fail here' is a tonal break that will produce the first week's tears." Her own
# recommendation was to drop it outright; the decision taken was to move it
# clear of the 4-6 default band instead, so it exists for an older sibling and
# is simply NOT THERE for a five-year-old (kidnix_shell.activities.in_age_band
# hides, it does not grey out). Revisit when a real seven-year-old has used it.
age_min = 7
age_max = 10
oars_rating = "violence-cartoon=mild"
network_required = false

source = "rpm"
package = "tuxmath"
licence = "GPL-3.0-or-later"
journal_watch = []
# SDL 1.2 through sdl12-compat, which sits on SDL2. Least confident of the set:
# the Flathub build is flagged X11-only in docs/research/07 §2.5. UNVERIFIED.
wayland_native = false

notes = """
Upstream has been dead since 2013; Fedora still carries 2.0.3 and it works. Included
because typed arithmetic practice is genuinely wanted at 6-8 and there is no live
alternative in the repos.

Its 142 MiB fluid-soundfont-gm Recommends is excluded at build time (see
50-activities.sh) -- that is 9x the size of the game for its MIDI background music.
If a child notices the silence, the fix is to add the soundfont back, not to drop
the game.
"""
