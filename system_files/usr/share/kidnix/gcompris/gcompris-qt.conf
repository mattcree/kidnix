; kidnix's GCompris settings, seeded into ~/.config/gcompris/gcompris-qt.conf
; for the kid account by /usr/lib/tmpfiles.d/kidnix-gcompris.conf.
;
; READ THIS BEFORE EDITING
;
; 1. The group MUST be spelled [%General], not [General]. GCompris does
;    `m_config.beginGroup("General")` on a QSettings::IniFormat file, and
;    QSettings reserves the literal `[General]` section for *top-level* keys --
;    so it escapes a real group called "General" to `%General` on write and
;    expects `%General` on read. A file written with [General] parses fine and
;    is then silently ignored. Verified in the image: seeding locale=fr_FR
;    under [%General] makes `gcompris-qt --export-activities-as-sql` emit
;    French titles; the same value under [General] leaves them English.
;
; 2. QSettings rewrites this file (sorted, comments stripped) every time
;    GCompris exits. These comments live in the /usr copy only. Values are
;    round-trip stable -- a full run of `gcompris-qt --launch clockgame`
;    returned every key below unchanged.
;
; 3. Key names and defaults were read out of the image, not out of memory:
;    a first run with an empty XDG_CONFIG_HOME writes GCompris' own defaults,
;    and that dump is the authority for every spelling here.
;
; Rationale for the values: docs/spikes/gcompris-curation.md.
; The curated activity shelf itself: curated.toml + CURATION.md beside this file.

[%General]

; --- language -----------------------------------------------------------------
; UK household, UK school. The en_GB translation is real, not a stub: it gives
; "Colours" and "analogue clock" where en_US gives "Colors" and "analog clock".
; The trailing .UTF-8 is the form GCompris itself normalises to.
locale=en_GB.UTF-8

; --- sound --------------------------------------------------------------------
; Voices are not decoration for a pre-reader; they are the instructions.
; The en_GB voice bundle is baked into the image by 50-activities.sh.
enableAudioVoices=true
enableAudioEffects=true
audioEffectsVolume=0.7

; Background music OFF, and its volume zeroed as a second line of defence.
; docs/research/05 §3 and SYNTHESIS §4: no background music under narration --
; concurrent music competes with speech for the same working-memory channel,
; which is the mechanism behind Takacs/Swart/Bus's "extraneous multimedia hurts".
; GCompris ships this ON by default (enableBackgroundMusic=true, volume 0.2).
enableBackgroundMusic=false
backgroundMusicVolume=0

; --- what the child can reach -------------------------------------------------
; Kiosk mode: the Home button in the bar becomes inert at menu depth 1, so
; GCompris cannot be exited from inside itself into a desktop that isn't there.
kiosk=true

; The kidnix shell owns navigation. Each curated activity is its own tile and is
; started with `--launch <id>`, so the child never sees the 190-activity menu.
; Hiding the home button keeps a mis-click from dropping them into it.
homeButtonVisible=false
sectionVisible=false

; A five-year-old cannot read "Do you really want to quit?". Quitting quits.
exitConfirmation=false

; Difficulty is GCompris' own 1-6 star rating. 1-2 stars is the 2-6 band, and it
; is the backstop for the shelf: even if something did reach the menu, nothing
; above two stars is listed. Note this is a *display* filter -- an activity
; started with --launch runs regardless -- so it is a second lock, not the lock.
filterLevelMin=1
filterLevelMax=2

; --- network ------------------------------------------------------------------
; The child session has no egress. GCompris' DownloadManager would otherwise
; try cdn.kde.org on first run and put a failing download dialog in front of a
; child who cannot read it. Assets are baked in at build time instead.
enableAutomaticDownloads=false

; --- type, cursor, keyboard ---------------------------------------------------
; Andika is GCompris' embedded default and is a literacy face designed for
; emergent readers (single-storey a and g, unambiguous I/l/1). Pinned rather
; than inherited so a font change upstream is a reviewed change here.
font=Andika-R.ttf
isCurrentFontEmbedded=true

; baseFontSize is a -7..+7 offset. +2 for a 4-6 year old at a normal viewing
; distance; verified in-image that the value survives a run (it is clamped to
; that range, so an out-of-band value would come back changed).
baseFontSize=2

; fontCapitalization is QFont::Capitalization: 0 MixedCase, 1 AllUppercase,
; 2 AllLowercase. UK phonics teaches lowercase first, so 2 is tempting -- and it
; is DELIBERATELY NOT USED. GCompris renders activity letter data with the same
; font as its chrome, so AllLowercase would break memory-case-association, the
; one activity on the shelf whose entire job is the uppercase/lowercase mapping,
; and would flatten the letters click_on_letter asks for. Lowercase-first is
; served by picking lowercase activities instead (see CURATION.md).
fontCapitalization=0

; Real keyboard, real mouse. "It teaches real computing" (AGENTS.md §3.7):
; no on-screen keyboard standing between the child and the actual keys.
virtualKeyboard=false
defaultCursor=false
noCursor=false

; The shell runs GCompris as the whole screen.
fullscreen=true

[Admin]
; Left at GCompris' default. enableAutomaticDownloads=false above is the gate;
; this only says where downloads *would* go if a parent ever turned them on.
downloadServerUrl=https://cdn.kde.org/gcompris
renderer=auto

; ------------------------------------------------------------------------------
; [Favorite] is GCompris' own per-activity flag (FAVORITE_GROUP_KEY), and the
; menu's first section filters on it. There is NO per-activity enable/disable
; key anywhere in ApplicationSettings -- ActivityInfoTree::filterEnabledActivities
; reads ActivityInfo::enabled(), a QML property compiled into the binary, not
; config. So favourites is the only config-level way to express "these ones",
; and it is a soft filter: it makes the curated 18 the first thing in the menu
; if the menu is ever reached. The hard filter is the shell launching each one
; by name. Keep this list identical to curated.toml -- 55-gcompris.sh fails the
; build if they diverge.
[Favorite]
adjacent_numbers=true
baby_tangram=true
click_on_letter=true
clickgame=true
clockgame=true
colors=true
enumerate=true
erase=true
erase_clic=true
frieze=true
gletters=true
learn_additions=true
learn_digits=true
learn_quantities=true
memory=true
memory-case-association=true
memory-sound=true
smallnumbers=true
