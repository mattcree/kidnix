# kidnix console keymap: UK.
#
# The virtual consoles are not where a child lives -- 40-lockdown.sh takes the
# VTs away entirely -- but this file is also what an installer, a rescue shell
# and (via systemd-localed) the initrd password prompt use, and a parent typing
# a recovery password on a UK keyboard must get the characters printed on the
# keys. `uk` is the console keymap name (kbd); the X11/Wayland layout for the
# same hardware is `gb`, in /etc/X11/xorg.conf.d/00-keyboard.conf.
KEYMAP=uk
FONT=eurlatgr
