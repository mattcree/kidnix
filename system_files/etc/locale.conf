# kidnix runs in British English, everywhere, for everyone.
#
# WHY THIS FILE EXISTS (docs/design/reviews/2026-08-23-early-years-teacher.md,
# BLOCKER): without it the machine falls back to C/en_US and every child-facing
# program shows American spellings. The evidence the teacher cited was our own
# screenshot -- Tux Paint's status bar reading "Pick a COLOR and a brush shape
# to draw with." on a machine whose stated job is helping a UK five-year-old
# with letters and spelling.
#
# HOW IT REACHES THE CHILD. systemd PID 1 reads /etc/locale.conf at boot and
# puts LANG into the default environment of every unit it starts -- including
# gdm.service, and including the child's `systemd --user` and therefore
# gnome-session, the shell and every activity it launches. There is no PAM or
# profile.d step to get wrong. `localectl set-locale` writes this same file;
# we ship it rather than run localectl at build time because localectl needs a
# running systemd-localed and a build container has neither.
#
# /etc is 3-way merged by bootc, so a parent who really wants a different
# locale can edit this and keep it across upgrades.
LANG=en_GB.UTF-8
