# kidnix's Piper voice, as a speech-dispatcher generic module.
#
# Registered by build_files/65-tts.sh, which appends
#   AddModule "kidnix-piper" "sd_generic" "kidnix-piper.conf"
#   DefaultModule kidnix-piper
# to /etc/speech-dispatcher/speechd.conf.
#
# WHY sd_generic AND NOT A NATIVE MODULE
# --------------------------------------
# speech-dispatcher master has a native Piper module (src/modules/cxxpiper.cpp,
# config/modules/cxxpiper.conf). It is not in 0.12.1, therefore not in
# Fedora 44 -- there is no sd_piper binary on this image. Until it ships,
# sd_generic shelling out is the only route. Upstream's own worked example for
# this shape is mimic3-generic.conf, sitting next to this file; the layout here
# follows it deliberately so the next person can diff the two.
#
# This file is NOT owned by any RPM (Fedora ships no kidnix-piper.conf), which
# is why it can live in system_files/ as a plain overlay while speechd.conf --
# which is %config(noreplace) and RPM-owned -- has to be edited from the build
# script instead.

# Debug 1 would fill $XDG_RUNTIME_DIR/speech-dispatcher/log/debug/ on every
# utterance. Note that this file being quiet does NOT make the helper quiet:
# speech-dispatcher redirects a module's stderr -- and therefore everything
# kidnix-piper-say prints -- into
# $XDG_RUNTIME_DIR/speech-dispatcher/log/kidnix-piper.log, which is where to
# look when read-aloud misbehaves. Because that file is easy to forget,
# kidnix-piper-say *also* sends the one message that matters ("the good voice
# is not working, falling back to espeak-ng") straight to the journal.
Debug 0

# The whole synthesiser, in one line.
#
#   printf %s '$DATA'   sd_generic substitutes the utterance into $DATA and
#                       escapes single quotes in it; this is exactly the
#                       quoting mimic3-generic.conf uses.
#   kidnix-piper-say    talks to the resident Piper server over a UNIX socket
#                       in $XDG_RUNTIME_DIR, falls back to espeak-ng if the
#                       server is not there, and plays the result itself.
#
# It plays the audio itself rather than piping into $PLAY_COMMAND because a
# WAV written to the runtime tmpfs and handed to pw-play by path has no
# sample-format ambiguity at all, and because the fallback voice (espeak-ng,
# 22050 Hz) and Piper (22050 Hz) would otherwise have to agree with whatever
# $PLAY_COMMAND was configured for.
GenericExecuteSynth \
"printf %s \'$DATA\' | /usr/libexec/kidnix-piper-say --rate \'$RATE\' --volume \'$VOLUME\' --language \'$LANGUAGE\'"

# Documentation, not enforcement: in speech-dispatcher 0.12.1 sd_generic parses
# GenericCmdDependency and only DBG-logs it -- the only path that actually
# gates on a missing file is AddVoice's VoiceFileDependency (checked in
# src/modules/module_utils_addvoice.c). The real guarantee that a child is
# never mute is therefore (a) build_files/65-tts.sh asserting the helper exists
# and synthesises, and (b) kidnix-piper-say falling back to espeak-ng by itself.
GenericCmdDependency "/usr/libexec/kidnix-piper-say"

# Pass speechd's own -100..100 scales through untouched. The mapping to
# Piper's length_scale (and the deliberate refusal to amplify above unity
# gain) lives in kidnix-piper-say, where it is readable and testable, rather
# than being smeared across three multiply/add directives here.
#
# **THE HUNDRED IS NOT A TYPO, AND THE FIRST VERSION OF THIS FILE HAD IT
# WRONG.** dotconf has no float type, so speech-dispatcher's generic module
# reads Generic*Multiply as hundredths:
#
#     value = speechd_value * (GenericRateMultiply / 100) + GenericRateAdd
#
# (Fedora's own dtk-generic.conf says so in as many words: "These values are
# multiplied by 100, because DotConf currently doesn't support floats. So you
# can write 0.85 as 85".) With `GenericRateMultiply 1` the multiplier is
# therefore **0.01**, and `GenericRateForceInteger 1` then truncates: a client
# asking for rate -20 arrived at kidnix-piper-say as `--rate 0`, and every
# utterance this image has ever spoken was synthesised at Piper's default
# length_scale 1.000 -- adult pace -- instead of the 1.10 the shell asks for.
# The same bug flattened VOLUME to 1, so the shell's volume control and the
# attenuation in kidnix-piper-say were dead too.
#
# Verified in a booted qcow2 VM (docs/spikes/tts.md 8):
#     Multiply 1   -> ARGV ['--rate', '0',   '--volume', '1']    length_scale 1.000
#     Multiply 100 -> ARGV ['--rate', '-20', '--volume', '100']  length_scale 1.100
#
# tests/image/test_tts.sh asserts the 100s, because a "tidy" edit back to 1
# would silently mute the whole rate/volume story again.
GenericRateAdd 0
GenericRateMultiply 100
GenericRateForceInteger 1
GenericVolumeAdd 0
GenericVolumeMultiply 100
GenericVolumeForceInteger 1

# Piper cannot change pitch: a VITS model sings at the pitch it was trained
# at. Passing pitch through unchanged is honest; pretending would not be.
GenericPitchAdd 0
GenericPitchMultiply 100
GenericPitchForceInteger 1

GenericDefaultCharset "UTF-8"

# NO GenericPunct* lines here. dotconf rejects an empty string argument --
# `GenericPunctNone ""` logs `Missing argument to option 'GenericPunctNone'`
# into the module log on every start (upstream's own mimic3-generic.conf has
# the same bug). The default for all four is already the empty string, and the
# command above does not substitute $PUNCT anyway: punctuation is never spoken
# to a five-year-old, and the shell asks for PunctuationMode.NONE on its own
# connection (shell/kidnix_shell/speech.py).

# The shipped voice. Both tiers are the same speaker and the same public-domain
# LibriVox dataset; which .onnx is actually loaded is chosen by
# /etc/kidnix/tts.env, not here, because the model is loaded once by the
# resident server rather than per utterance.
#
# en-GB first: this is a UK household and phonics depend on the accent
# (docs/research/06 section 7.5 #29). en and en-US are mapped to the same
# voice so an English utterance is never dropped for want of a voice entry;
# anything non-English is routed to espeak-ng inside kidnix-piper-say.
AddVoice "en-GB" "FEMALE1" "en_GB-cori-high"
AddVoice "en"    "FEMALE1" "en_GB-cori-high"
AddVoice "en-US" "FEMALE1" "en_GB-cori-high"
