# kidnix keyboard layout: United Kingdom.
#
# Despite the path, this is the file systemd-localed owns and every modern
# Wayland compositor reads for the SYSTEM keyboard layout -- mutter (and so
# gnome-kiosk and the GDM greeter) asks localed for it. It is exactly what
# `localectl set-x11-keymap gb` would write; we ship it because localectl
# needs a running systemd-localed, which a build container does not have.
#
# This is the greeter/system half. The child's own session gets the same
# layout as a locked dconf default in
# system_files/usr/share/kidnix/dconf/kid.d/10-input
# (org.gnome.desktop.input-sources sources), because GNOME's per-session input
# sources override the system layout once a session is running.
#
# Why it matters at five: the @ and " keys are swapped between gb and us, the
# £ sign does not exist on us at all, and a child copying a letter from a book
# gets a different symbol than the one on the keycap.
Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        Option "XkbLayout" "gb"
        Option "XkbModel" "pc105"
EndSection
