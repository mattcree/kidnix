# kidnix sshd hardening.
#
# WHY sshd IS ENABLED AT ALL on a child's offline computer, which looks like
# exactly the service you would turn off first:
#
#   1. `just test-boot` -- THE boot test -- reaches the VM with
#      `bcvk ephemeral ssh`, which injects a generated key and logs in over
#      sshd. Disabling sshd in the image deletes our only fast, rootless,
#      no-sudo proof that the machine boots into the kiosk at all. That is a
#      worse trade than the surface it costs.
#   2. A parent whose graphical session is broken has one remaining way in
#      that does not need a rescue USB.
#
# So it stays on, and this file shrinks it instead. sshd takes the FIRST value
# it sees for a keyword, and /etc/ssh/sshd_config's `Include
# /etc/ssh/sshd_config.d/*.conf` is its first line, so `10-` beats Fedora's
# `40-`/`50-` drop-ins.
#
# Everything here is one line in /etc away from being undone on a running
# machine (`sudo $EDITOR /etc/ssh/sshd_config.d/10-kidnix.conf`), and /etc is
# 3-way merged across bootc upgrades, so an edit survives.

# The child's account must not be reachable from the network under any
# circumstances. `kid` has no password today (20-users.sh), but "has no
# password" is a fact about the current build, not a policy. This is.
DenyUsers kid

# Key authentication only. The parent has a password -- for sudo and for GDM,
# both of which need physical presence. A machine that spends its life on
# other people's wifi should not also accept that password from the network.
# bcvk and the parent's own laptop both use keys.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# Explicit rather than inherited: upstream's default is already
# prohibit-password, and a future default change should not quietly loosen a
# child's machine.
PermitRootLogin prohibit-password

# Things a family computer has no use for, each of which is a code path an
# attacker can reach before authenticating or a pivot after it.
GSSAPIAuthentication no
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
