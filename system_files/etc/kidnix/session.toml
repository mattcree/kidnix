# kidnix session policy -- how long a child gets and how the session ends.
#
# Root-owned and read-only to the child on purpose (docs/design/shell-v0.1.md
# section 6): the machine ends the session, and the child cannot argue with it.
# It lives in /etc rather than /usr because a parent is meant to edit it; bootc
# 3-way-merges /etc across upgrades, so local edits survive `bootc upgrade`.
#
# Read by kidnix_shell.session.load_policy(). Every key is optional and every
# unparseable value falls back to the built-in default with a warning in the
# journal -- a broken config must never stop a child logging in. The values
# below ARE the built-in defaults, written out so a parent can see the whole
# policy in one place. Numbers come from docs/research/SYNTHESIS.md section 3.

# One sitting. SYNTHESIS section 3: 25 min default, 10-45 supported range.
length_minutes = 25

# Ceiling across the whole day, reset at 04:00 local.
daily_budget_minutes = 60

# THE SHORTEST SITTING THERE IS.
#
# Below this the shell does not start a session at all: "Who's here?" answers
# with a warm no ("That's all the computer time for today. Ready to go and
# play?") and the grown-up sheet refuses a sub-minimum grant in words, naming
# this number.
#
# It exists because until 2026-08-23 a session was granted whatever was left --
# so the third sitting of a 60-minute day was ten minutes, and a well-meant
# "+5" on a spent day produced a two-minute sitting that BEGAN inside its own
# put-away: the child answered "What's next after?" with a plan and was told
# "Let's keep that" over nothing ninety seconds later. Better a warm no at the
# door than a broken promise ninety seconds in.
#
# The floor on this floor is 3 minutes; anything lower is raised to it with a
# warning, because the two-beat ending ritual does not fit inside less.
min_session_minutes = 5

# THE ENDING RITUAL. Both numbers are CEILINGS, not fixed points.
#
# The two windows are a proportion of what was actually granted -- 20% for the
# ending offer and 10% for put-away -- clamped to 2-4 minutes and 1-2 minutes
# respectively. Fixed windows meant the ending was a quarter of a 25-minute
# sitting, 40% of a 15-minute one and 60% of a 10-minute one; worse, the sun
# changed its rate between sittings, so a child who had spent three weeks
# learning to read it was misled on exactly the sittings that matter most.
#
# Lower these to shorten the ending; the floors (2 min and 1 min) are not
# configurable, because a ritual with no room in it is not a ritual.
# S5 "would you like to finish this?" then S6 "put your things away".
ending_offer_minutes = 4
put_away_minutes = 2

# Outside this window the shell shows the Sleeping screen (S8) instead of
# starting a session. A grown-up can still unlock it from the PIN sheet.
# Set both to the same value to switch bedtime off entirely.
bedtime_start = "19:00"
bedtime_end = "07:00"

# NOT HERE: the read-aloud hover dwell (`hover_dwell_ms`), how fast Home grows
# (`[home]`) and the "What's next after?" options (`[[next_after]]`) live in
# parent.toml, next to the allow-list and the profiles. This file is the
# *session policy* -- how long a sitting is and how it ends -- and nothing
# else. See /etc/kidnix/parent.toml.
