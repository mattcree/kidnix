# kidnix GDM configuration.
#
# The child never sees a login screen: the machine boots straight into the
# kiosk. Which session that is comes from AccountsService (see
# /usr/lib/tmpfiles.d/kidnix.conf), not from here.
#
# TO DISABLE AUTOLOGIN FOR DEBUGGING (/etc is writable on a running system):
#   sudo sed -i 's/^AutomaticLoginEnable=.*/AutomaticLoginEnable=False/' /etc/gdm/custom.conf
#   sudo systemctl restart gdm
# ...which gives you the normal GDM greeter and a session picker (gear icon).
#
# To skip the graphical stack entirely, add `systemd.unit=multi-user.target`
# to the kernel command line from the GRUB menu (press `e`), or persistently:
#   sudo systemctl set-default multi-user.target

[daemon]
AutomaticLoginEnable=True
AutomaticLogin=kid

# The kid account has no password, so GDM must not offer it in a user list.
[greeter]

[security]

[xdmcp]

[chooser]

[debug]
# Uncomment when a session fails to start; output lands in the journal.
#Enable=true
